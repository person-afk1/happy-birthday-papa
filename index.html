<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Dispatch 🎂</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      /* Main alignment: elements at top and bottom */
      justify-content: space-between;
      align-items: center;
      background-size: cover;
      background-position: center;
      background-color: #111;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      position: relative;
    }

    /* Full-screen Background Video */
    #bg-video {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      z-index: 1;
      transform: translate(-50%, -50%);
      object-fit: cover;
      display: none;
    }

    /* Container for Header Content (TOP) */
    .header-content {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 1.5rem 1rem;
      /* Subtle dark fade at top for text readability */
      background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
    }

    h1 { font-size: 1.8rem; line-height: 1.2; font-weight: 800; }

    /* Container for Footer Content (BOTTOM) */
    .footer-content {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 1rem 1rem 2rem 1rem; /* Extra padding at bottom */
      /* Subtle dark fade at bottom for text/button readability */
      background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px; /* Space between message and button */
    }

    p { font-size: 1.1rem; line-height: 1.5; color: #f0f0f0; max-width: 90%; }

    /* Universal Button Style */
    .btn {
      padding: 12px 28px;
      font-size: 1rem;
      background: #e91e63; /* Pink */
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s, transform 0.1s;
      box-shadow: 0 4px 15px rgba(233, 30, 99, 0.4);
    }
    
    .btn:active {
      transform: scale(0.97);
    }

    /* Mute/Secondary Button Style */
    .btn-secondary {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid white;
      color: white;
      box-shadow: none;
    }
  </style>

  <!-- Firebase SDK (Standard v8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <!-- Background Video Element -->
  <video id="bg-video" loop muted playsinline></video>

  <!-- Title Section (TOP) -->
  <div class="header-content">
    <h1 id="title">Happy Birthday Papa! 🎉</h1>
  </div>

  <!-- Empty Center for Photos/Video -->

  <!-- Message & Control Section (BOTTOM) -->
  <div class="footer-content">
    <p id="message">Activate your trip dispatch!</p>
    <button id="action-btn" class="btn" onclick="handleButtonClick()">Tap to Unlock Music 🎵</button>
  </div>

  <!-- Background Audio Element -->
  <audio id="bg-audio" loop></audio>

  <script>
    // EXACT Firebase Configuration (Singapore Database URL)
    const firebaseConfig = {
      apiKey: "AIzaSyDs245uSIqkn6-lYHUo7aWxEaVNpeaZA1k",
      authDomain: "happy-birthday-papa-e7e39.firebaseapp.com",
      databaseURL: "https://happy-birthday-papa-e7e39-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "happy-birthday-papa-e7e39",
      storageBucket: "happy-birthday-papa-e7e39.firebasestorage.app",
      messagingSenderId: "936953437581",
      appId: "1:936953437581:web:6b719192c64a4c664fb1c4",
      measurementId: "G-BYEZR5YS22"
    };
    firebase.initializeApp(firebaseConfig);

    const db = firebase.database();
    const audio = document.getElementById('bg-audio');
    const video = document.getElementById('bg-video');
    const actionBtn = document.getElementById('action-btn');

    let userInteracted = false;

    function handleButtonClick() {
      // First click: Request Notifications & Start Media
      if (!userInteracted) {
        userInteracted = true;
        
        // Notification permission request for phone automation
        if ("Notification" in window && Notification.permission !== "granted") {
          Notification.requestPermission();
        }

        if (audio.src) audio.play();
        if (video.src) video.play();
        
        // Update button appearance
        actionBtn.innerText = "Pause Music ⏸️";
        actionBtn.classList.add("btn-secondary");
        return;
      }

      // Subsequent clicks: Toggle Audio Play/Pause
      if (audio.paused) {
        audio.play();
        actionBtn.innerText = "Pause Music ⏸️";
      } else {
        audio.pause();
        actionBtn.innerText = "Play Music ▶️";
      }
    }

    // Real-time Firebase Listener
    db.ref('current_display').on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      document.getElementById('title').innerText = data.title || "Happy Birthday!";
      document.getElementById('message').innerText = data.message || "";

      // Handle Video
      if (data.videoUrl && data.videoUrl.trim() !== "") {
        video.src = data.videoUrl;
        video.style.display = 'block';
        if (userInteracted) video.play();

        if (data.hasVideoAudio) {
          video.muted = false;
          audio.pause();
          actionBtn.style.display = 'none'; // Hide music button if video has audio
        } else {
          video.muted = true;
          actionBtn.style.display = 'inline-block';
        }
      } else {
        video.pause();
        video.style.display = 'none';
        video.src = "";
        actionBtn.style.display = 'inline-block';
      }

      // Handle Background Image
      if (data.bgImage && (!data.videoUrl || data.videoUrl.trim() === "")) {
        document.body.style.backgroundImage = `url('${data.bgImage}')`;
      }

      // Handle Audio Track
      if (data.audioUrl && (!data.videoUrl || !data.hasVideoAudio)) {
        audio.src = data.audioUrl;
        if (userInteracted) {
          audio.play();
          actionBtn.innerText = "Pause Music ⏸️";
        }
      } else if (!data.audioUrl) {
        audio.pause();
      }
    });
  </script>
</body>
</html>
