<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Dispatch 🎂</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-size: cover;
      background-position: center;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      position: relative;
      background-color: #111;
    }
    #bg-video {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      z-index: 1;
      transform: translate(-50%, -50%);
      object-fit: cover;
      display: none;
    }
    .overlay {
      position: relative;
      z-index: 2;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      padding: 2rem;
      border-radius: 20px;
      max-width: 85%;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    h1 { font-size: 2rem; margin-bottom: 12px; line-height: 1.2; }
    p { font-size: 1.1rem; line-height: 1.5; color: #e0e0e0; }
    .btn {
      position: relative;
      z-index: 3;
      padding: 12px 24px;
      font-size: 1rem;
      background: #e91e63;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      margin-top: 18px;
      font-weight: bold;
      transition: background 0.3s;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid white;
    }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <!-- Background Video Element -->
  <video id="bg-video" loop muted playsinline></video>

  <!-- Message Card Overlay -->
  <div class="overlay">
    <h1 id="title">Happy Birthday Papa! 🎉</h1>
    <p id="message">Tap below to activate your trip dispatch!</p>
    <button id="action-btn" class="btn" onclick="handleButtonClick()">Tap to Unlock Music 🎵</button>
  </div>

  <!-- Background Audio Element -->
  <audio id="bg-audio" loop></audio>

  <script>
    // Exact Firebase Configuration with Singapore Region URL
    const firebaseConfig = {
      apiKey: "AIzaSyDs245uSIqkn6-lYHUo7aWxEaVNpeaZA1k",
      authDomain: "happy-birthday-papa-e7e39.firebaseapp.com",
      databaseURL: "https://happy-birthday-papa-e7e39-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "happy-birthday-papa-e7e39",
      storageBucket: "happy-birthday-papa-e7e39.firebasestorage.app",
      messagingSenderId: "936953437581",
      appId: "1:936953437581:web:6b719192c64a4c664fb1c4",
      measurementId: "G-BYEZR5YS22"
    };
    firebase.initializeApp(firebaseConfig);

    const db = firebase.database();
    const audio = document.getElementById('bg-audio');
    const video = document.getElementById('bg-video');
    const actionBtn = document.getElementById('action-btn');

    let userInteracted = false;

    function handleButtonClick() {
      // First click: Request Notifications & Start Media
      if (!userInteracted) {
        userInteracted = true;
        
        // Request Notification permission for phone routines
        if ("Notification" in window && Notification.permission !== "granted") {
          Notification.requestPermission();
        }

        if (audio.src) audio.play();
        if (video.src) video.play();
        
        actionBtn.innerText = "Pause Music ⏸️";
        actionBtn.classList.add("btn-secondary");
        return;
      }

      // Subsequent clicks: Toggle Audio Play / Pause
      if (audio.paused) {
        audio.play();
        actionBtn.innerText = "Pause Music ⏸️";
      } else {
        audio.pause();
        actionBtn.innerText = "Play Music ▶️";
      }
    }

    // Real-time Firebase Listener
    db.ref('current_display').on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      document.getElementById('title').innerText = data.title || "Happy Birthday!";
      document.getElementById('message').innerText = data.message || "";

      // Handle Video
      if (data.videoUrl && data.videoUrl.trim() !== "") {
        video.src = data.videoUrl;
        video.style.display = 'block';
        if (userInteracted) video.play();

        if (data.hasVideoAudio) {
          video.muted = false;
          audio.pause();
          actionBtn.style.display = 'none'; // Hide music button if video has audio
        } else {
          video.muted = true;
          actionBtn.style.display = 'inline-block';
        }
      } else {
        video.pause();
        video.style.display = 'none';
        video.src = "";
        actionBtn.style.display = 'inline-block';
      }

      // Handle Background Image
      if (data.bgImage && (!data.videoUrl || data.videoUrl.trim() === "")) {
        document.body.style.backgroundImage = `url('${data.bgImage}')`;
      }

      // Handle Audio Track
      if (data.audioUrl && (!data.videoUrl || !data.hasVideoAudio)) {
        audio.src = data.audioUrl;
        if (userInteracted) {
          audio.play();
          actionBtn.innerText = "Pause Music ⏸️";
        }
      } else if (!data.audioUrl) {
        audio.pause();
      }
    });
  </script>
</body>
</html>
